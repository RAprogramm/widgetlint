name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request: {}
  workflow_dispatch: {}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

concurrency:
  group: ci-${{ github.ref }}
  # Main runs carry the release pipeline; never cancel them mid-flight.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ==========================================================================
  # Stage 1 — instant feedback, no workspace compilation.
  # ==========================================================================
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
          components: rustfmt
      - run: cargo +nightly fmt --all --check

  compliance:
    name: Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: REUSE license check
        uses: fsfe/reuse-action@v6.0.0
      - name: Install actionlint
        run: |
          set -euo pipefail
          VERSION="1.7.12"
          ARCHIVE="actionlint_${VERSION}_linux_amd64.tar.gz"
          BASE="https://github.com/rhysd/actionlint/releases/download/v${VERSION}"
          curl -fsSL -o "${ARCHIVE}" "${BASE}/${ARCHIVE}"
          curl -fsSL -o checksums.txt \
            "${BASE}/actionlint_${VERSION}_checksums.txt"
          grep " ${ARCHIVE}\$" checksums.txt | sha256sum --check --strict
          tar -xzf "${ARCHIVE}" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
      - name: actionlint
        run: >-
          actionlint -color
          -ignore 'unexpected key "cache-mode"'
      - name: zizmor security audit
        uses: taiki-e/install-action@v2.90.5
        with:
          tool: zizmor@1.32.0
      - run: zizmor --min-severity medium .github/workflows/ .github/dependabot.yml
      - run: yamllint .github/workflows/
      - name: Release tooling tests
        run: python3 -m doctest tools/bump_lock.py

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1

  # ==========================================================================
  # Stage 2 — the shared build: compiles every target once and warms the
  # rust-cache that all later stages restore from.
  # ==========================================================================
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2.9.3
      - run: >-
          cargo clippy --workspace --all-targets --all-features --locked
          -- -D warnings -W clippy::pedantic -W clippy::nursery

  msrv:
    name: MSRV (Rust 1.100)
    needs: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.100"
      - run: cargo build --workspace --locked

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2.9.3
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked
      - run: cargo run -p xtask --locked -- check-docs
      - run: cargo run -p wl-cli --locked -- schema | python3 -m json.tool > /dev/null

  # ==========================================================================
  # Stage 3 — heavy verification, gated on the fast checks and the shared build.
  # ==========================================================================
  test:
    name: Test (${{ matrix.os }})
    needs: [clippy, docs]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: taiki-e/install-action@v2.90.5
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --locked
      - run: cargo test --workspace --doc --locked

  coverage:
    name: Coverage
    needs: [clippy, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: taiki-e/install-action@v2.90.5
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - run: >-
          cargo llvm-cov nextest --workspace --locked
          --fail-under-lines 95 --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          files: lcov.info
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          files: target/nextest/default/junit.xml
          flags: rust
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  zlib-parity:
    name: zlib parity
    needs: [clippy, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo build --locked
      - run: python3 tools/zlib_parity.py

  benchmarks:
    name: Benchmarks (CodSpeed)
    needs: [clippy, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # OpenID Connect authentication with CodSpeed; no token secret needed.
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: taiki-e/install-action@v2.90.5
        with:
          tool: cargo-codspeed@6.0.0
      - name: Build the benchmarks
        run: >-
          cargo codspeed build -m simulation --locked
          -p wl-size -p wl-check -p wl-html -p wl-css -p wl-js -p wl-profile
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5.6.3
        with:
          mode: simulation
          run: cargo codspeed run

  pages:
    name: Playground build
    needs: [clippy, docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: crates/wl-wasm
      - uses: taiki-e/install-action@v2.90.5
        with:
          tool: wasm-pack
      - name: Build the wasm package
        run: wasm-pack build crates/wl-wasm --target web --out-dir ../../playground/pkg
      - name: Build the rule site
        run: cargo run -p xtask --locked -- gen-site
      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: playground

  pages-deploy:
    name: Playground deploy
    needs: pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1

  # ==========================================================================
  # Stage 4 — the heaviest build, only once everything else is green.
  # ==========================================================================
  release-build:
    name: Release build
    needs: [test, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo build --release --workspace --locked

  # ==========================================================================
  # Stage 5 — release pipeline on main only: git-cliff version bump, tag,
  # per-platform binaries with provenance, GitHub Release.
  # ==========================================================================
  version-bump:
    name: Version bump
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - fmt
      - compliance
      - supply-chain
      - clippy
      - docs
      - test
      - coverage
      - zlib-parity
      - release-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      version_bumped: ${{ steps.bump.outputs.version_bumped }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install git-cliff
        shell: bash
        env:
          GIT_CLIFF_VERSION: "2.14.2"
        run: |
          set -euo pipefail
          ARCHIVE="git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          BASE="https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}"
          curl -fsSL -o "${ARCHIVE}" "${BASE}/${ARCHIVE}"
          curl -fsSL -o "${ARCHIVE}.sha512" "${BASE}/${ARCHIVE}.sha512"
          sha512sum --check --strict < "${ARCHIVE}.sha512"
          tar -xzf "${ARCHIVE}" --strip-components=1 \
            "git-cliff-${GIT_CLIFF_VERSION}/git-cliff"
          sudo install -m 0755 git-cliff /usr/local/bin/git-cliff

      - name: Compute next version
        id: bump
        run: |
          set -euo pipefail

          LATEST_TAG=$(git describe --tags --abbrev=0 \
            --match "v[0-9]*.[0-9]*.[0-9]*" 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: ${LATEST_TAG}"

          NEXT=$(git-cliff --config cliff.toml --bumped-version \
            | tr -d '[:space:]')
          NEXT="${NEXT#v}"

          CURRENT=$(grep -m1 '^version = ' Cargo.toml \
            | sed 's/.*"\(.*\)".*/\1/')
          NEXT=$(printf '%s\n%s\n' "${NEXT}" "${CURRENT}" \
            | sort -V | tail -1)
          echo "Computed next version: ${NEXT}"

          if [ "${NEXT}" = "${LATEST_TAG#v}" ]; then
            echo "version_bumped=false" >> "$GITHUB_OUTPUT"
            echo "No releasable commits since ${LATEST_TAG}"
            exit 0
          fi

          if git tag --list "v${NEXT}" | grep -qx "v${NEXT}"; then
            echo "Tag v${NEXT} already exists; release pipeline converges"
            echo "new_version=${NEXT}" >> "$GITHUB_OUTPUT"
            echo "version_bumped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "new_version=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "version_bumped=true" >> "$GITHUB_OUTPUT"

      - name: Update files and create tag
        if: steps.bump.outputs.version_bumped == 'true'
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          set -euo pipefail

          TAG_CREATED=false
          if git tag --list "v${NEW_VERSION}" | grep -qx "v${NEW_VERSION}"; then
            echo "Tag v${NEW_VERSION} already exists; converging"
          else
            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            sed -i "s/^version = \".*\"/version = \"${NEW_VERSION}\"/" Cargo.toml
            python3 tools/bump_lock.py "${NEW_VERSION}" Cargo.lock

            git add Cargo.toml Cargo.lock
            git diff --cached --quiet || \
              git commit -m "chore: bump version to ${NEW_VERSION} [skip ci]"

            git tag "v${NEW_VERSION}"

            git-cliff --config cliff.toml -o CHANGELOG.md
            git add CHANGELOG.md
            if ! git diff --cached --quiet; then
              git commit -m "docs: update changelog for ${NEW_VERSION} [skip ci]"
              git tag -f "v${NEW_VERSION}"
            fi
            TAG_CREATED=true
          fi

          git merge --ff-only "v${NEW_VERSION}"
          git push origin main
          if [ "${TAG_CREATED}" = "true" ]; then
            git push origin "v${NEW_VERSION}"
          fi

  release-gate:
    name: Release gate
    needs:
      - fmt
      - compliance
      - supply-chain
      - clippy
      - docs
      - test
      - coverage
      - zlib-parity
      - release-build
      - version-bump
    if: >-
      always() &&
      needs.fmt.result == 'success' &&
      needs.compliance.result == 'success' &&
      needs.supply-chain.result == 'success' &&
      needs.clippy.result == 'success' &&
      needs.docs.result == 'success' &&
      needs.test.result == 'success' &&
      needs.coverage.result == 'success' &&
      needs.zlib-parity.result == 'success' &&
      needs.release-build.result == 'success' &&
      (
        (github.event_name == 'push' &&
          startsWith(github.ref, 'refs/tags/v')) ||
        needs.version-bump.outputs.version_bumped == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine version
        id: version
        env:
          BUMPED_VERSION: ${{ needs.version-bump.outputs.new_version }}
        run: |
          if [ -n "${BUMPED_VERSION}" ]; then
            VER="${BUMPED_VERSION}"
          else
            VER="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7.0.1
        with:
          ref: "v${{ steps.version.outputs.version }}"
          persist-credentials: false

      - name: Verify tag matches manifest version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          MANIFEST=$(grep -m1 '^version = ' Cargo.toml \
            | sed 's/.*"\(.*\)".*/\1/')
          if [ "${MANIFEST}" != "${VERSION}" ]; then
            echo "::error::tag v${VERSION} != Cargo.toml ${MANIFEST}"
            exit 1
          fi
          echo "Tag v${VERSION} matches Cargo.toml"

  build-release:
    name: Build release (${{ matrix.target }})
    needs: [release-gate]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    cache-mode: none
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar
          - os: macos-15
            target: x86_64-apple-darwin
            archive: tar
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: v${{ needs.release-gate.outputs.version }}
          persist-credentials: false
      - name: Add the target
        run: rustup target add "${{ matrix.target }}"
      - name: Build
        run: >-
          cargo build --release --locked -p wl-cli --target ${{ matrix.target }}
      - name: Package (unix)
        if: matrix.archive == 'tar'
        env:
          VERSION: ${{ needs.release-gate.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          NAME="widgetlint-${VERSION}-${TARGET}"
          mkdir -p dist
          cp "target/${TARGET}/release/widgetlint" dist/
          cp README.md LICENSE dist/
          tar -czf "${NAME}.tar.gz" -C dist widgetlint README.md LICENSE
          sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          VERSION: ${{ needs.release-gate.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          $VERSION = $env:VERSION
          $TARGET = $env:TARGET
          $NAME = "widgetlint-${VERSION}-${TARGET}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${TARGET}/release/widgetlint.exe" dist/
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "${NAME}.zip"
          $HASH = (Get-FileHash "${NAME}.zip" -Algorithm SHA256).Hash.ToLower()
          "$HASH  ${NAME}.zip" | Out-File -Encoding ascii "${NAME}.zip.sha256"
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v2.4.0
        with:
          subject-path: |
            widgetlint-*-${{ matrix.target }}.tar.gz
            widgetlint-*-${{ matrix.target }}.tar.gz.sha256
            widgetlint-*-${{ matrix.target }}.zip
            widgetlint-*-${{ matrix.target }}.zip.sha256
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: |
            widgetlint-*-${{ matrix.target }}.tar.gz
            widgetlint-*-${{ matrix.target }}.tar.gz.sha256
            widgetlint-*-${{ matrix.target }}.zip
            widgetlint-*-${{ matrix.target }}.zip.sha256

  create-release:
    name: Create GitHub Release
    needs: [release-gate, build-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    cache-mode: none
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: v${{ needs.release-gate.outputs.version }}
          persist-credentials: true
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
      - name: Install git-cliff
        shell: bash
        env:
          GIT_CLIFF_VERSION: "2.14.2"
        run: |
          set -euo pipefail
          ARCHIVE="git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          BASE="https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}"
          curl -fsSL -o "${ARCHIVE}" "${BASE}/${ARCHIVE}"
          curl -fsSL -o "${ARCHIVE}.sha512" "${BASE}/${ARCHIVE}.sha512"
          sha512sum --check --strict < "${ARCHIVE}.sha512"
          tar -xzf "${ARCHIVE}" --strip-components=1 \
            "git-cliff-${GIT_CLIFF_VERSION}/git-cliff"
          sudo install -m 0755 git-cliff /usr/local/bin/git-cliff
      - name: Generate release notes
        run: >-
          git-cliff --config cliff.toml --latest
          --strip header -o RELEASE_NOTES.md
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-gate.outputs.version }}
        run: |
          set -euo pipefail
          NOTES=(--title "widgetlint v${VERSION}"
                 --notes-file RELEASE_NOTES.md --latest)
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release edit "v${VERSION}" "${NOTES[@]}"
          else
            gh release create "v${VERSION}" "${NOTES[@]}"
          fi
          gh release upload "v${VERSION}" widgetlint-* --clobber
      - name: Move the floating tag
        env:
          VERSION: ${{ needs.release-gate.outputs.version }}
        run: |
          set -euo pipefail
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION#*.}"
          MINOR="${MINOR%%.*}"
          if [ "${MAJOR}" = "0" ]; then
            FLOATING="v${MAJOR}.${MINOR}"
          else
            FLOATING="v${MAJOR}"
          fi
          git tag -f "${FLOATING}" "v${VERSION}"
          # A floating tag is a moving pointer by design, so it is force-pushed.
          git push --force origin "${FLOATING}"
