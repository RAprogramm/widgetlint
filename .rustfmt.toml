# Formatting requires nightly: `cargo +nightly fmt`.
# Reference: https://github.com/RAprogramm/RustManifest/blob/main/.rustfmt.toml

edition = "2024"

# Do not add a trailing comma when there is a single element.
trailing_comma = "Never"

# Braces stay on the same line.
brace_style = "SameLineWhere"

# Align struct fields when the length is below the threshold.
struct_field_align_threshold = 20

# Format documentation comments and code blocks inside them.
wrap_comments = true
format_code_in_doc_comments = true

# Never collapse struct literals onto a single line.
struct_lit_single_line = false

max_width = 99

# Import grouping: std, external crates, internal modules.
imports_granularity = "Crate"
group_imports = "StdExternalCrate"
reorder_imports = true

# Required for the unstable options above (nightly only).
unstable_features = true

newline_style = "Unix"
