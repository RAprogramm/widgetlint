[package]
name = "wl-cli"
description = "Command line interface for widgetlint"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "widgetlint"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap.workspace = true
globset.workspace = true
masterror.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
wl-check.workspace = true
wl-core.workspace = true
wl-mcp.workspace = true
wl-profile.workspace = true
wl-size.workspace = true

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
tokio = { workspace = true, features = ["process"] }
