[package]
name = "wl-check"
description = "End-to-end widget checking pipeline without input or output"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["zlib-size"]
# Vendored reference zlib through `wl-size` (native builds).
zlib-size = ["wl-size/zlib-sys"]
# Pure-Rust zlib backend for wasm builds.
rust-size-backend = ["wl-size/rust-backend"]

[dependencies]
masterror.workspace = true
schemars = "1"
serde.workspace = true
serde_json.workspace = true
wl-core.workspace = true
wl-css.workspace = true
wl-html.workspace = true
wl-js.workspace = true
wl-profile.workspace = true
wl-size = { workspace = true, default-features = false }

[dev-dependencies]
criterion.workspace = true
masterror.workspace = true

[[bench]]
name = "check"
harness = false

[lints]
workspace = true
