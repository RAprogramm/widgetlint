[workspace]
resolver = "3"
members = [
  "crates/wl-cli",
  "crates/wl-check",
  "crates/wl-core",
  "crates/wl-css",
  "crates/wl-html",
  "crates/wl-js",
  "crates/wl-profile",
  "crates/wl-size",
]

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/RAprogramm/widgetlint"
version = "0.1.0"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["zlib"] }
html5ever = "0.40"
libz-sys = { version = "1", features = ["static"] }
masterror = "0.32"
oxc_allocator = "0.158.0"
oxc_ast = "0.158.0"
oxc_ast_visit = "0.158.0"
oxc_parser = "0.158.0"
oxc_span = "0.158.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tendril = "0.5"
toml = "1"
wl-core = { path = "crates/wl-core", version = "0.1.0" }
wl-check = { path = "crates/wl-check", version = "0.1.0" }
wl-css = { path = "crates/wl-css", version = "0.1.0" }
wl-html = { path = "crates/wl-html", version = "0.1.0" }
wl-js = { path = "crates/wl-js", version = "0.1.0" }
wl-profile = { path = "crates/wl-profile", version = "0.1.0" }
wl-size = { path = "crates/wl-size", version = "0.1.0" }

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "deny"
module_name_repetitions = "allow"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
overflow-checks = true
strip = "symbols"

[profile.release-cli]
inherits = "release"
panic = "abort"

[profile.release-wasm]
inherits = "release"
opt-level = "z"
panic = "abort"

[profile.bench]
debug = true
inherits = "release"
strip = "none"
